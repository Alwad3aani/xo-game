<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="author" content="م. ماجد الودعاني">
<!-- تصميم م. ماجد الودعاني — © 2026 جميع الحقوق محفوظة -->
<title>إكس أو بلا تعادل</title>
<style>
  :root{
    --bg:#0f1226; --panel:#1a1e3d; --cell:#232850; --cell-h:#2c3263;
    --x:#ff5c7a; --o:#3dd6c6; --text:#eef0ff; --muted:#9aa0c8; --gold:#ffd166;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{
    margin:0;background:radial-gradient(circle at 50% 0%,#1d2250 0%,var(--bg) 60%);
    color:var(--text);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:16px;
  }
  .app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
  h1{margin:0;text-align:center;font-size:26px;letter-spacing:.5px}
  .sub{margin:0;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;min-height:44px}

  .optlabel{font-size:12px;color:var(--muted);margin:0 4px -6px}
  .modes{display:flex;background:var(--panel);border-radius:14px;padding:4px;gap:4px}
  .modes button{
    flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
    padding:10px 6px;border-radius:10px;cursor:pointer;transition:.2s
  }
  .modes button.active{background:var(--cell-h);color:var(--text);font-weight:700}

  .score{display:flex;gap:10px}
  .player{
    flex:1;background:var(--panel);border-radius:16px;padding:10px 12px;text-align:center;
    border:2px solid transparent;transition:.25s;opacity:.6
  }
  .player.turn{opacity:1;transform:translateY(-2px)}
  .player.px.turn{border-color:var(--x);box-shadow:0 6px 22px rgba(255,92,122,.25)}
  .player.po.turn{border-color:var(--o);box-shadow:0 6px 22px rgba(61,214,198,.25)}
  .player .sym{font-size:22px;font-weight:900;line-height:1}
  .px .sym{color:var(--x)} .po .sym{color:var(--o)}
  .player .name{font-size:12px;color:var(--muted);margin-top:4px}
  .player .pts{font-size:24px;font-weight:800;margin-top:2px}

  .status{text-align:center;font-size:16px;font-weight:700;min-height:24px}
  .status.win{color:var(--gold)}
  .status.warn{color:var(--gold);animation:shake .3s}

  .board{
    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr;
    background:var(--panel);padding:12px;border-radius:22px
  }
  .cell{
    aspect-ratio:1/1;min-width:0;width:100%;
    border:0;background:var(--cell);border-radius:16px;cursor:pointer;position:relative;
    display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s,box-shadow .15s;padding:0
  }
  .cell:hover{background:var(--cell-h)}
  .cell:active{transform:scale(.96)}
  .cell svg{position:absolute;top:19%;left:19%;width:62%;height:62%;overflow:visible}
  .cell .mark{stroke-width:13;stroke-linecap:round;fill:none}
  .cell.x .mark{stroke:var(--x)} .cell.o .mark{stroke:var(--o)}
  .cell.pop svg{animation:pop .28s cubic-bezier(.3,1.6,.5,1)}
  .cell.next svg{opacity:.3;animation:blink 1s ease-in-out infinite}
  .cell.can{box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
  .cell.picked{box-shadow:inset 0 0 0 3px var(--gold);background:rgba(255,209,102,.12)}
  .cell.gone svg{animation:vanish .3s ease-in forwards}
  .cell.winc{background:rgba(255,209,102,.18);box-shadow:inset 0 0 0 3px var(--gold)}
  .cell.winc svg{animation:pulse .7s ease-in-out infinite alternate}
  .board.locked .cell{cursor:default}
  @keyframes pop{from{transform:scale(0) rotate(-25deg)}to{transform:scale(1)}}
  @keyframes blink{0%,100%{opacity:.3}50%{opacity:.12}}
  @keyframes vanish{to{transform:scale(0) rotate(40deg);opacity:0}}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}
  @keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}

  .actions{display:flex;gap:10px}
  .btn{
    flex:1;border:0;border-radius:14px;padding:13px;font:inherit;font-size:15px;font-weight:700;
    cursor:pointer;color:var(--text);background:var(--cell-h);transition:.15s
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,#6c63ff,#8a5cff)}
  .credit{text-align:center;color:var(--gold);font-size:14px;font-weight:700;margin-top:4px}
  .ver{text-align:center;color:#5c6294;font-size:11px;margin-top:-6px}
</style>
</head>
<body>
<div class="app">
  <h1>إكس أو بلا تعادل</h1>
  <p class="sub" id="sub"></p>

  <div class="optlabel">طريقة اللعب</div>
  <div class="modes" id="modes">
    <button data-mode="2p" class="active">لاعبان</button>
    <button data-mode="cpu">ضد الكمبيوتر</button>
  </div>

  <div class="optlabel">تحريك العلامة</div>
  <div class="modes" id="moveModes">
    <button data-move="auto" class="active">تلقائي</button>
    <button data-move="manual">لعب مفتوح</button>
  </div>

  <div class="score">
    <div class="player px" id="pX"><div class="sym">✕</div><div class="name" id="nameX">اللاعب الأول</div><div class="pts" id="ptsX">0</div></div>
    <div class="player po" id="pO"><div class="sym">◯</div><div class="name" id="nameO">اللاعب الثاني</div><div class="pts" id="ptsO">0</div></div>
  </div>

  <div class="status" id="status"></div>
  <div class="board" id="board"></div>

  <div class="actions">
    <button class="btn primary" id="again">جولة جديدة</button>
    <button class="btn" id="reset">تصفير النتيجة</button>
  </div>
  <div class="credit">تصميم م. ماجد الودعاني</div>
  <div class="ver">© 2026 جميع الحقوق محفوظة · الإصدار 1.4</div>
</div>

<script>
(function(){
  var MAX = 3;
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var SVG = {
    x:'<svg viewBox="0 0 100 100"><path class="mark" d="M12 12 L88 88 M88 12 L12 88"/></svg>',
    o:'<svg viewBox="0 0 100 100"><circle class="mark" cx="50" cy="50" r="40"/></svg>'
  };
  var SUB = {
    auto:'لكل لاعب ٣ علامات فقط. عند وضع الرابعة تختفي أقدم علامة له تلقائياً، وتستمر اللعبة حتى يفوز أحدكما.',
    manual:'لكل لاعب ٣ علامات فقط. بعدها تختار أنت أي علامة من علاماتك تنقلها إلى خانة فارغة، وتستمر اللعبة حتى يفوز أحدكما.'
  };
  var boardEl = document.getElementById('board');
  var statusEl = document.getElementById('status');
  var cells = [];
  var board, queue, turn, over, busy, picked;
  var mode = '2p', moveMode = 'auto', starter = 'x';
  var score = {x:0, o:0};

  for (var i=0;i<9;i++){
    var b = document.createElement('button');
    b.className = 'cell'; b.setAttribute('aria-label','خانة '+(i+1));
    (function(idx){ b.addEventListener('click', function(){ onTap(idx); }); })(i);
    boardEl.appendChild(b); cells.push(b);
  }

  function newRound(){
    board = [null,null,null,null,null,null,null,null,null];
    queue = {x:[], o:[]};
    turn = starter; over = false; busy = false; picked = null;
    boardEl.classList.remove('locked');
    cells.forEach(function(c){ c.className='cell'; c.innerHTML=''; });
    document.getElementById('sub').textContent = SUB[moveMode];
    render();
    if (mode==='cpu' && turn==='o') cpuSoon();
  }

  function label(p){
    if (mode==='cpu') return p==='x' ? 'أنت' : 'الكمبيوتر';
    return p==='x' ? 'اللاعب الأول' : 'اللاعب الثاني';
  }
  function sym(p){ return p==='x' ? ' ✕' : ' ◯'; }
  function humanTurn(){ return !(mode==='cpu' && turn==='o'); }
  // هل اللاعب الحالي في مرحلة اختيار علامة يحركها بنفسه؟
  function mustPick(){ return !over && moveMode==='manual' && queue[turn].length===MAX && humanTurn(); }

  function render(){
    document.getElementById('nameX').textContent = label('x');
    document.getElementById('nameO').textContent = label('o');
    document.getElementById('ptsX').textContent = score.x;
    document.getElementById('ptsO').textContent = score.o;
    document.getElementById('pX').classList.toggle('turn', !over && turn==='x');
    document.getElementById('pO').classList.toggle('turn', !over && turn==='o');

    cells.forEach(function(c){ c.classList.remove('next','can','picked'); });
    if (over) return;

    statusEl.className = 'status';
    if (mustPick()){
      if (picked === null){
        queue[turn].forEach(function(k){ cells[k].classList.add('can'); });
        statusEl.textContent = label(turn) + sym(turn) + ': اختر العلامة التي تريد تحريكها';
      } else {
        cells[picked].classList.add('picked','next');
        statusEl.textContent = label(turn) + sym(turn) + ': اختر الخانة الجديدة';
      }
    } else {
      // الوضع التلقائي: تمييز العلامة التي ستختفي
      if (moveMode==='auto' && queue[turn].length === MAX) cells[queue[turn][0]].classList.add('next');
      statusEl.textContent = 'الدور على: ' + label(turn) + sym(turn);
    }
  }

  function warn(msg){
    statusEl.className = 'status';
    void statusEl.offsetWidth;
    statusEl.className = 'status warn';
    statusEl.textContent = msg;
  }

  function onTap(i){
    if (over || busy || !humanTurn()) return;
    if (mustPick()){
      if (board[i] === turn){            // اختيار/تغيير/إلغاء العلامة المراد تحريكها
        picked = (picked === i) ? null : i;
        render(); return;
      }
      if (board[i]) return;              // خانة الخصم
      if (picked === null){ warn('اختر أولاً علامة من علاماتك لتحريكها'); return; }
      play(i, picked); return;
    }
    play(i, null);
  }

  // from: العلامة التي تُزال (null = الأقدم تلقائياً عند اكتمال ٣ علامات)
  function play(i, from){
    if (board[i]) return;
    var p = turn;
    if (queue[p].length === MAX){
      var old = (from !== null && from !== undefined) ? from : queue[p][0];
      queue[p].splice(queue[p].indexOf(old), 1);
      board[old] = null;
      var oc = cells[old];
      oc.classList.remove('next','can','picked'); oc.classList.add('gone');
      setTimeout(function(){ if(!board[old]){ oc.className='cell'; oc.innerHTML=''; } }, 300);
    }
    picked = null;
    board[i] = p; queue[p].push(i);
    var c = cells[i];
    c.className = 'cell ' + p + ' pop';
    c.innerHTML = SVG[p];

    var line = winLine(board, p);
    if (line){
      over = true; score[p]++; starter = (p==='x') ? 'o' : 'x';
      boardEl.classList.add('locked');
      render();
      line.forEach(function(k){ cells[k].classList.add('winc'); });
      statusEl.className = 'status win';
      statusEl.textContent = '🎉 الفائز: ' + label(p) + sym(p);
      return;
    }
    turn = (p==='x') ? 'o' : 'x';
    render();
    if (mode==='cpu' && turn==='o') cpuSoon();
  }

  function winLine(bd, p){
    for (var k=0;k<LINES.length;k++){
      var L = LINES[k];
      if (bd[L[0]]===p && bd[L[1]]===p && bd[L[2]]===p) return L;
    }
    return null;
  }

  // ===== الكمبيوتر =====
  function cpuSoon(){
    busy = true;
    setTimeout(function(){
      busy = false; if (over) return;
      var mv = cpuMove(); play(mv.to, mv.from);
    }, 600);
  }

  // كل الحركات الممكنة للاعب p حسب وضع التحريك
  function options(bd, q, p){
    var free = [], out = [], i, j;
    for (i=0;i<9;i++) if (!bd[i]) free.push(i);
    if (q[p].length < MAX){
      for (i=0;i<free.length;i++) out.push({from:null, to:free[i]});
    } else if (moveMode === 'auto'){
      for (i=0;i<free.length;i++) out.push({from:q[p][0], to:free[i]});
    } else {
      for (j=0;j<q[p].length;j++)
        for (i=0;i<free.length;i++) out.push({from:q[p][j], to:free[i]});
    }
    return out;
  }
  function sim(bd, q, p, mv){
    var nb = bd.slice(), nq = {x:q.x.slice(), o:q.o.slice()};
    if (mv.from !== null){ nb[mv.from] = null; nq[p].splice(nq[p].indexOf(mv.from),1); }
    nb[mv.to] = p; nq[p].push(mv.to);
    return {b:nb, q:nq};
  }
  function canWin(bd, q, p){
    var ops = options(bd, q, p);
    for (var i=0;i<ops.length;i++) if (winLine(sim(bd,q,p,ops[i]).b, p)) return true;
    return false;
  }

  function cpuMove(){
    var ops = options(board, queue, 'o'), i, s;
    // ١) فوز مباشر
    for (i=0;i<ops.length;i++){
      if (winLine(sim(board, queue, 'o', ops[i]).b, 'o')) return ops[i];
    }
    // ٢) حركات لا تعطي الخصم فوزاً في دوره التالي
    var safe = [];
    for (i=0;i<ops.length;i++){
      s = sim(board, queue, 'o', ops[i]);
      if (!canWin(s.b, s.q, 'x')) safe.push(ops[i]);
    }
    var pool = safe.length ? safe : ops;
    // ٣) تفضيل الوسط ثم الزوايا
    var center = pool.filter(function(m){ return m.to === 4; });
    if (center.length) return center[Math.floor(Math.random()*center.length)];
    var corners = pool.filter(function(m){ return [0,2,6,8].indexOf(m.to) > -1; });
    var best = corners.length ? corners : pool;
    return best[Math.floor(Math.random()*best.length)];
  }

  // ===== الأزرار =====
  function setActive(group, attr, val){
    [].forEach.call(group.children, function(b){ b.classList.toggle('active', b.getAttribute(attr)===val); });
  }
  document.getElementById('again').addEventListener('click', newRound);
  document.getElementById('reset').addEventListener('click', function(){
    score = {x:0,o:0}; starter = 'x'; newRound();
  });
  document.getElementById('modes').addEventListener('click', function(e){
    var m = e.target.getAttribute('data-mode'); if(!m || m===mode) return;
    mode = m; score = {x:0,o:0}; starter = 'x';
    setActive(this, 'data-mode', m); newRound();
  });
  document.getElementById('moveModes').addEventListener('click', function(e){
    var m = e.target.getAttribute('data-move'); if(!m || m===moveMode) return;
    moveMode = m;
    setActive(this, 'data-move', m); newRound();
  });

  newRound();
})();
</script>
</body>
</html>
